<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · KSPPS Nur Insani</title>
<link rel="stylesheet" href="assets/vendor/bootstrap-5.3.3/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/app/app.css">
<link rel="stylesheet" href="assets/app/login.css">
<script>
    // halaman login selalu tampil penuh (keluar dari frame), sama seperti sebelumnya
    if (top != self) { top.location = self.location; }
    // tanda # dan ' tidak boleh diketik (perilaku lama)
    function kutip_satu(e) {
        e = e || window.event;
        return !(e.keyCode == 35 || e.keyCode == 39 || e.key === '#' || e.key === "'");
    }
</script>
</head>
<body class="halaman-login">

<main class="login-bungkus">
  <section class="login-sisi" aria-hidden="true">
    <div class="login-sisi-isi">
      <div class="login-lencana">KSPPS</div>
      <h1>Nur Insani</h1>
      <p>Melayani dengan hati.</p>
      <ul class="login-poin">
        <li>Pembiayaan &amp; simpanan anggota</li>
        <li>Pencatatan transaksi harian unit</li>
        <li>Laporan untuk setiap level pengguna</li>
      </ul>
    </div>
    <svg class="login-ornamen" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1">
        <path d="M100 10 L127 37 L165 37 L165 75 L190 100 L165 125 L165 163 L127 163 L100 190 L73 163 L35 163 L35 125 L10 100 L35 75 L35 37 L73 37 Z"/>
        <path d="M100 40 L118 58 L142 58 L142 82 L160 100 L142 118 L142 142 L118 142 L100 160 L82 142 L58 142 L58 118 L40 100 L58 82 L58 58 L82 58 Z"/>
        <circle cx="100" cy="100" r="22"/>
      </g>
    </svg>
  </section>

  <section class="login-panel">
    <div class="login-kartu">
      <img class="login-logo" src="Image/ni.png" alt="KSPPS Nur Insani">
      <h2>Selamat datang</h2>
      <p class="text-body-secondary mb-4">Masuk dengan User ID dan password Anda.</p>

      <form action="log.php?op=in" method="post" name="form1" id="form1" autocomplete="off">
        <div class="form-floating mb-3">
          <input class="form-control" name="userid" id="userid" type="text" placeholder="User ID"
                 onkeypress="return kutip_satu(event)" autocapitalize="off" spellcheck="false" autofocus>
          <label for="userid">User ID</label>
        </div>
        <div class="form-floating mb-2 login-sandi">
          <input class="form-control" name="psw" id="psw" type="password" placeholder="Password">
          <label for="psw">Password</label>
          <button type="button" class="login-lihat" id="lihat-sandi" aria-label="Tampilkan password" aria-pressed="false">Lihat</button>
        </div>
        <div class="login-capslock" id="capslock" hidden>Caps Lock aktif</div>
        <button name="submit" value="Login" id="submit" class="btn btn-ni btn-lg w-100 mt-3" type="submit">
          <span class="teks-tombol">Masuk</span>
          <span class="spinner-border spinner-border-sm ms-2" aria-hidden="true" hidden></span>
        </button>
      </form>

      <p class="login-hak">Copyright &copy; KSPS Nur Insani 2017</p>
    </div>
  </section>
</main>

<script>
(function () {
    var form = document.getElementById('form1');
    var sandi = document.getElementById('psw');
    var lihat = document.getElementById('lihat-sandi');
    var caps = document.getElementById('capslock');
    var kirim = false;

    lihat.addEventListener('click', function () {
        var tampil = sandi.type === 'password';
        sandi.type = tampil ? 'text' : 'password';
        lihat.textContent = tampil ? 'Sembunyi' : 'Lihat';
        lihat.setAttribute('aria-pressed', tampil ? 'true' : 'false');
        sandi.focus();
    });

    function cekCaps(e) {
        if (e.getModifierState) {
            caps.hidden = !e.getModifierState('CapsLock');
        }
    }
    sandi.addEventListener('keydown', cekCaps);
    sandi.addEventListener('keyup', cekCaps);

    // cegah kirim dua kali (perilaku lama: variabel processing)
    form.addEventListener('submit', function (e) {
        if (kirim) {
            e.preventDefault();
            return;
        }
        kirim = true;
        var tombol = document.getElementById('submit');
        tombol.querySelector('.spinner-border').hidden = false;
        tombol.querySelector('.teks-tombol').textContent = 'Memeriksa…';
        // tombol tidak di-disable supaya nilai submit=Login tetap terkirim
        tombol.setAttribute('aria-disabled', 'true');
        tombol.classList.add('disabled');
    });
    // tombol kembali (bfcache): pulihkan tombol
    window.addEventListener('pageshow', function () {
        kirim = false;
        var tombol = document.getElementById('submit');
        tombol.classList.remove('disabled');
        tombol.removeAttribute('aria-disabled');
        tombol.querySelector('.spinner-border').hidden = true;
        tombol.querySelector('.teks-tombol').textContent = 'Masuk';
    });
})();
</script>
</body>
</html>
